[project]
name = "jobpipe"
version = "0.1.0"
description = "Run a model over a whole dataset on Hugging Face Jobs with one command: embed (more tasks coming). Zero-config with receipts, or eject to an editable uv script."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "huggingface_hub>=1.20",
    "httpx>=0.27",
    "pydantic>=2.7",
    "fsspec>=2024.2",
    "pyarrow>=15",
]

# Two front doors, one package:
# - `jobpipe` — the direct runner (pip/uvx install)
# - `hf-pipe` — the `hf` CLI extension loader expects a console script named
#   exactly `hf-pipe`; installed via `hf extensions install davanstrien/hf-pipe`,
#   invoked as `hf pipe ...`
[project.scripts]
jobpipe = "jobpipe.cli:main"
hf-pipe = "jobpipe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpipe"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
